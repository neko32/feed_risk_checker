name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: app

jobs:
  build-test-lint:
    name: Build / Test / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Check formatting (cargo fmt)
        run: cargo fmt -- --check

      - name: Lint (cargo clippy --pedantic)
        # critical/highの指摘はここで気づいた時点で都度修正する運用とし、
        # low/medium相当の指摘は許容する（詳細はCLAUDE.local.md参照）。
        run: cargo clippy --all-targets -- -W clippy::pedantic

      - name: Build
        run: cargo build --verbose

      - name: Unit + Integration tests
        run: cargo test --verbose

  coverage:
    name: Coverage (>= 90%)
    runs-on: ubuntu-latest
    needs: build-test-lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Generate coverage report and enforce >= 90% line coverage
        run: cargo llvm-cov --html --output-dir ../docs/coverage --fail-under-lines 90

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: docs/coverage/html
