name: Release

on:
  push:
    tags:
      - "v*"

defaults:
  run:
    working-directory: app

jobs:
  build-release:
    name: Build release binary (musl static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl build tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Run full test suite before releasing
        run: cargo test --verbose

      - name: Build release binary (x86_64-unknown-linux-musl)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/feed_risk_checker dist/feed_risk_checker
          tar -czf "dist/feed_risk_checker-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz" -C dist feed_risk_checker

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist/feed_risk_checker-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz
          generate_release_notes: true
